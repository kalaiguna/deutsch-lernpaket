<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch B2 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base:         #0F172A;
  --bg-surface:      #1E293B;
  --bg-surface-2:    #263448;
  --bg-surface-3:    #2D3E57;
  --border:          #334155;
  --border-2:        #475569;
  --accent:          #8B5CF6;
  --accent-hover:    #7C3AED;
  --accent-dim:      #2D1B69;
  --accent-light:    #C4B5FD;
  --text-primary:    #F8FAFC;
  --text-secondary:  #94A3B8;
  --sidebar-width:   240px;
  --header-height:   64px;

  /* JS-referenced variable names kept, values updated for dark theme */
  --bg:              #0F172A;
  --surface:         #1E293B;
  --surface-2:       #263448;
  --surface-3:       #2D3E57;
  --primary:         #8B5CF6;
  --primary-hover:   #7C3AED;
  --text:            #F8FAFC;
  --text-2:          #CBD5E1;
  --text-muted:      #94A3B8;
  --text-faint:      #64748B;
  --input-border:    #475569;
  --stale:           #FB923C;
  --wrong:           #F87171;
  --right:           #34D399;
  --cell-empty:      #263448;
  --cell-conv:       #8B5CF6;
  --cell-quiz:       #6366F1;
  --cell-both:       #4C1D95;
  --cell-listen:     #06B6D4;
  --cell-listen-conv:#0E7490;
  --cell-writing:    #A78BFA;
  --cell-grammar:    #818CF8;
  --cell-review:     #C084FC;
  --banner-snap-bg:      #1C1400;
  --banner-snap-border:  #D97706;
  --banner-snap-text:    #FDE68A;
  --banner-live-bg:      #1A1035;
  --banner-live-border:  #7C3AED;
  --banner-live-text:    #C4B5FD;
  --banner-focus-bg:     #2D1B69;
  --banner-focus-border: #7C3AED;
  --banner-focus-text:   #C4B5FD;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
}

/* ── Sidebar ─────────────────────────────────────── */
#sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.25s ease;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo-circle {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: white;
  flex-shrink: 0;
}

.logo-text { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.logo-sub  { font-size: 11px; color: var(--text-muted); }

.sidebar-nav {
  flex: 1;
  padding: 12px 8px;
  overflow-y: auto;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
  margin-bottom: 2px;
}

.nav-link:hover { background: var(--bg-surface-2); color: var(--text-primary); }
.nav-link.active { background: var(--accent-dim); color: var(--accent-light); }
.nav-link svg { width: 18px; height: 18px; flex-shrink: 0; }

.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-faint);
  padding: 12px 12px 4px;
}

.sidebar-user {
  padding: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.user-avatar {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: white;
  flex-shrink: 0;
}

.user-name  { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.user-level { font-size: 11px; color: var(--text-muted); }

/* ── Page wrapper ────────────────────────────────── */
#page-wrapper {
  margin-left: var(--sidebar-width);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-width: 0;
}

/* ── Top header ──────────────────────────────────── */
#top-header {
  position: sticky;
  top: 0;
  height: var(--header-height);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  z-index: 90;
  flex-shrink: 0;
}

#hamburger {
  display: none;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
}

.header-greeting {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
}

.header-search {
  flex: 1;
  display: flex;
  justify-content: center;
}

.search-input {
  width: 100%;
  max-width: 360px;
  padding: 8px 16px;
  background: var(--bg-base);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
}

.search-input::placeholder { color: var(--text-faint); }
.search-input:focus { outline: none; border-color: var(--accent); }

.header-date {
  font-size: 13px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ── Main content ────────────────────────────────── */
#main-content { padding: 28px 24px; flex: 1; }
.wrap { max-width: 1100px; margin: 0 auto; }

/* ── Typography ──────────────────────────────────── */
h2 {
  color: var(--text-primary);
  margin: 32px 0 12px 0;
  font-size: 18px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
}

h3 { color: var(--text-muted); margin: 16px 0 8px 0; font-size: 14px; font-weight: 600; }
.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }

/* ── Banners ─────────────────────────────────────── */
.banner {
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin: 0 0 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.banner.snapshot { background: var(--banner-snap-bg); border: 1px solid var(--banner-snap-border); color: var(--banner-snap-text); }
.banner.live     { background: var(--banner-live-bg); border: 1px solid var(--banner-live-border); color: var(--banner-live-text); }
.banner.focus    { background: var(--banner-focus-bg); border: 1px solid var(--banner-focus-border); color: var(--banner-focus-text); margin: 0 0 4px 0; }

.banner button {
  background: var(--accent);
  color: white;
  border: 0;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}

.banner button:hover { background: var(--accent-hover); }
.banner button:disabled { background: var(--border-2); cursor: not-allowed; }

/* ── Cards ───────────────────────────────────────── */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}

.card:hover { transform: translateY(-2px); }

/* ── KPI Grid ────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin: 16px 0 8px 0;
}

.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}

.kpi-card:hover { transform: translateY(-2px); }
.kpi-value { font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.kpi-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }

/* ── Layout rows ─────────────────────────────────── */
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ── Charts ──────────────────────────────────────── */
.chart-box { position: relative; height: 280px; }

/* ── Tables ──────────────────────────────────────── */
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }

table.data th {
  background: var(--bg-surface-2);
  text-align: left;
  padding: 8px 10px;
  font-weight: 600;
  color: var(--text-2);
  border-bottom: 1px solid var(--border);
}

table.data td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  color: var(--text-primary);
}

table.data tr:last-child td { border-bottom: none; }

/* ── Tags ────────────────────────────────────────── */
.tag {
  display: inline-block;
  background: var(--bg-surface-2);
  color: var(--accent-light);
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 12px;
  margin: 3px 4px 3px 0;
}

.tag.dim { background: var(--bg-surface-3); color: var(--text-muted); }

/* ── Heatmap ─────────────────────────────────────── */
.heatmap { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 0; }

.cell { width: 18px; height: 18px; border-radius: 4px; background: var(--cell-empty); position: relative; }
.cell.conv           { background: var(--cell-conv); }
.cell.quiz           { background: var(--cell-quiz); }
.cell.both           { background: var(--cell-both); }
.cell.listening      { background: var(--cell-listen); }
.cell.listening-conv { background: var(--cell-listen-conv); }
.cell.writing        { background: var(--cell-writing); }
.cell.grammar        { background: var(--cell-grammar); }
.cell.monthly-review { background: var(--cell-review); }

.cell[title]:hover::after {
  content: attr(title);
  position: absolute;
  top: -28px; left: 50%;
  transform: translateX(-50%);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  z-index: 10;
}

.legend { font-size: 12px; color: var(--text-muted); display: flex; gap: 12px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }

/* ── Misc ────────────────────────────────────────── */
.hint { color: var(--text-faint); font-size: 12px; font-style: italic; }
.muted { color: var(--text-faint); font-size: 12px; }
.section-intro { font-size: 13px; color: var(--text-muted); margin: 4px 0 12px 0; }

.bar-bg { background: var(--bg-surface-3); border-radius: 4px; height: 8px; overflow: hidden; margin: 4px 0; }
.bar-fill { background: var(--accent); height: 100%; }
.flex { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding: 3px 0; }

/* ── Vocab tabs ──────────────────────────────────── */
.vtabs-nav { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin: 16px 0 12px 0; flex-wrap: wrap; }

.vtab {
  background: none;
  border: none;
  padding: 8px 14px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  border-radius: 6px 6px 0 0;
}

.vtab.active { color: var(--accent-light); border-bottom-color: var(--accent); font-weight: 700; background: var(--bg-surface-2); }
.vtab:hover:not(.active) { background: var(--bg-surface-2); color: var(--text-primary); }
.vtab-count { color: var(--text-faint); font-size: 11px; margin-left: 4px; }
.vtab.active .vtab-count { color: var(--accent-light); }
.vtab-panel { display: none; }
.vtab-panel.active { display: block; }

.vtab-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

.vsearch {
  flex: 1;
  min-width: 180px;
  padding: 7px 12px;
  border: 1px solid var(--input-border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg-base);
  color: var(--text-primary);
}

.vsearch:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,92,246,0.3); }

.vtheme-filter, .vsort-toggle {
  padding: 7px 10px;
  border: 1px solid var(--input-border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg-surface);
  color: var(--text-primary);
  cursor: pointer;
}

.vtab-list { max-height: 420px; overflow-y: auto; padding-right: 4px; border: 1px solid var(--border); border-radius: 6px; }

.vitem {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: minmax(140px, 1fr) 2fr auto;
  gap: 12px;
  align-items: baseline;
  font-size: 13px;
}

.vitem:last-child { border-bottom: none; }
.vitem:hover { background: var(--bg-surface-2); }
.vitem-word { font-weight: 600; color: var(--accent-light); }
.vitem-meaning { color: var(--text-muted); font-size: 12px; }
.vitem-meta { color: var(--text-faint); font-size: 11px; text-align: right; white-space: nowrap; }
.vitem.stale .vitem-meta { color: var(--stale); font-weight: 600; }
.vitem.stale .vitem-word::before { content: "⏰ "; font-size: 11px; }

.vgroup-header {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 10px 12px 4px 12px;
  background: var(--bg-surface-2);
  border-bottom: 1px solid var(--border);
}

.vtab-empty { padding: 30px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

.diag {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-surface-2);
  padding: 8px;
  border-radius: 6px;
  white-space: pre-wrap;
  margin-top: 8px;
  max-height: 200px;
  overflow: auto;
}

details summary { cursor: pointer; color: var(--text-muted); font-size: 12px; }

/* ── Type badges ─────────────────────────────────── */
.type-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.2px; }
.type-badge.type-conv      { background: var(--cell-conv);    color: white; }
.type-badge.type-listening { background: var(--cell-listen);  color: white; }
.type-badge.type-quiz      { background: var(--bg-surface-3); color: var(--accent-light); border: 1px solid var(--border); }
.type-badge.type-writing   { background: var(--cell-writing); color: white; }
.type-badge.type-grammar   { background: var(--cell-grammar); color: white; }
.type-badge.type-reading   { background: var(--cell-listen);  color: white; }
.type-badge.type-review    { background: var(--cell-review);  color: white; }

/* ── Trends ──────────────────────────────────────── */
.trend-up     { color: var(--wrong); font-weight: 700; }
.trend-down   { color: var(--right); font-weight: 700; }
.trend-stable { color: var(--text-faint); }

/* ── Session log ─────────────────────────────────── */
.session-row { cursor: pointer; }
.session-row:hover { background: var(--bg-surface-2); }
.session-detail-row { display: none; }
.session-detail-row.open { display: table-row; }
.session-detail-row td { background: var(--bg-surface-2); padding: 12px 16px; }

/* ── Focus card ──────────────────────────────────── */
.focus-card {
  background: var(--bg-surface);
  border: 1px solid var(--banner-focus-border);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 0 0 16px 0;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
}

.focus-card h3 { color: var(--banner-focus-text); margin: 0 0 8px 0; font-size: 14px; }

.focus-cat {
  display: inline-block;
  background: var(--banner-focus-bg);
  color: var(--banner-focus-text);
  border: 1px solid var(--banner-focus-border);
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 600;
  margin: 3px 4px 3px 0;
}

/* ── Mobile overlay ──────────────────────────────── */
#sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 99;
}

/* ── Responsive ──────────────────────────────────── */
@media (max-width: 768px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay.open { display: block; }
  #page-wrapper { margin-left: 0; }
  #hamburger { display: block; }
  .header-greeting { font-size: 14px; }
  .row { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  #main-content { padding: 16px 12px; }
  .heatmap { gap: 3px; }
  .vitem { grid-template-columns: 1fr; gap: 2px; }
  .vitem-meta { text-align: left; }
  .vtab { padding: 6px 10px; font-size: 12px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>

function normalizeMcpResponse(resp, depth) {
  depth = depth || 0;
  if (depth > 6 || resp == null) return resp;
  if (Array.isArray(resp)) return resp;
  if (typeof resp === 'object') {
    if (Array.isArray(resp.content)) {
      const text = resp.content.map(c => (c && typeof c.text === 'string') ? c.text : '').join('');
      return normalizeMcpResponse(text, depth + 1);
    }
    if (resp.result !== undefined) return normalizeMcpResponse(resp.result, depth + 1);
    if (resp.data !== undefined) return normalizeMcpResponse(resp.data, depth + 1);
    return resp;
  }
  if (typeof resp === 'string') {
    const trimmed = resp.trim();
    if (trimmed && (trimmed.startsWith('[') || trimmed.startsWith('{') || trimmed.startsWith('"'))) {
      try { return normalizeMcpResponse(JSON.parse(trimmed), depth + 1); } catch {}
    }
    return resp;
  }
  return resp;
}

async function tryLiveLoadDatabase() {
  if (!window.cowork || typeof window.cowork.callMcpTool !== 'function') {
    return { ok: false, diag: 'window.cowork.callMcpTool not available' };
  }
  const diagLines = [];
  try {
    const raw = await window.cowork.callMcpTool('notion_query_database', {
      database_id: NOTION_DB_ID,
      sorts: [{ property: 'Date', direction: 'ascending' }],
      page_size: 100
    });
    if (raw && raw.isError) return { ok: false, diag: 'notion_query_database -> error' };
    const norm = normalizeMcpResponse(raw);
    const rows = Array.isArray(norm) ? norm : (norm && Array.isArray(norm.results) ? norm.results : []);
    diagLines.push('notion_query_database (database mode) -> ' + rows.length + ' rows');
    if (rows.length === 0) return { ok: false, diag: diagLines.join('\n') };

    const sessions = [], quizDates = [];
    const getTextProp = (p) => { if (!p) return ''; const a = p.title || p.rich_text || []; return Array.isArray(a) ? a.map(t => (t && t.plain_text) || '').join('') : ''; };
    const getSelectProp = (p) => (p && p.select && p.select.name) || '';
    const getDateProp = (p) => (p && p.date && p.date.start) || '';
    const getNumProp = (p) => (p && p.number != null) ? p.number : 0;

    for (const row of rows) {
      const props = row.properties || {};
      const date = getDateProp(props.Date || props.date);
      const theme = getTextProp(props.Theme || props.theme);
      const type = getSelectProp(props.Type || props.type);
      const name = getTextProp(props.Name || props.name || props.title);
      if (!date) continue;
      if (type === 'quiz' || (name && name.startsWith('Deutsch B2 Quiz'))) {
        quizDates.push(date.substring(0, 10)); continue;
      }
      const session = {
        date: date.substring(0, 10),
        theme: theme || 'Unbekannt',
        name: name || ('Deutsch B2 Sitzung, ' + date.substring(0, 10)),
        type: type || 'conv',
        nouns: [], adjectives: [], verbs: [], idioms: [], mistakes: [],
        stats: { 'Wörter insgesamt': getNumProp(props['Word Count']), 'Fehler gesamt': getNumProp(props['Mistake Count']), 'Sitzungsdauer (Minuten)': 30 }
      };
      const score = getTextProp(props.Score || props.score);
      if (score) session.stats['Score'] = score;
      const srcUrl = props['Source URL'] && props['Source URL'].url;
      if (srcUrl) session.source_url = srcUrl;
      sessions.push(session);
    }

    if (sessions.length === 0 && quizDates.length === 0) return { ok: false, diag: diagLines.join('\n') };
    sessions.sort((a, b) => a.date.localeCompare(b.date));
    return { ok: true, sessions, reviewDates: quizDates, diag: diagLines.join('\n') };
  } catch (e) {
    return { ok: false, diag: 'notion_query_database threw: ' + (e.message || String(e)) };
  }
}

async function tryLiveLoad() {
  const diagLines = [];
  if (!window.cowork || typeof window.cowork.callMcpTool !== 'function') {
    return { ok: false, diag: 'window.cowork.callMcpTool not available' };
  }
  if (NOTION_DB_ID) return tryLiveLoadDatabase();

  // Search Notion for all seven session types
  const queries = [
    { q: 'Deutsch B2 Konversation', type: 'conv' },
    { q: 'Deutsch B2 Quiz', type: 'quiz' },
    { q: 'Deutsch B2 Übersetzung', type: 'listening' },
    { q: 'Deutsch B2 Schreiben', type: 'writing' },
    { q: 'Deutsch B2 Lektüre', type: 'reading' },
    { q: 'Deutsch B2 Grammatik', type: 'grammar' },
    { q: 'Deutsch B2 Monatsrückblick', type: 'review' }
  ];
  const pages = [];
  for (const { q, type } of queries) {
    try {
      const raw = await window.cowork.callMcpTool('notion_search', { query: q, filter: { property: 'object', value: 'page' } });
      if (raw && raw.isError) { diagLines.push('notion_search "' + q + '" -> error'); continue; }
      const norm = normalizeMcpResponse(raw);
      const results = Array.isArray(norm) ? norm : (norm && Array.isArray(norm.results) ? norm.results : []);
      results.forEach(p => { if (p) pages.push({ page: p, type }); });
      diagLines.push('notion_search "' + q + '" -> ' + results.length + ' pages');
    } catch (e) {
      diagLines.push('notion_search "' + q + '" -> threw: ' + (e.message || String(e)));
    }
  }
  if (pages.length === 0) return { ok: false, diag: diagLines.join('\n') };

  function getPageTitle(page) {
    const props = page.properties || {};
    const titleProp = props.title || props.Name || props.name || Object.values(props).find(p => p && p.type === 'title');
    if (!titleProp) return '';
    const arr = titleProp.title || titleProp.rich_text || [];
    return Array.isArray(arr) ? arr.map(t => (t && t.plain_text) || '').join('') : '';
  }

  const seen = new Set();
  const sessions = [], quizDates = [];

  for (const { page, type } of pages) {
    const pageId = page.id;
    if (!pageId || seen.has(pageId)) continue;
    seen.add(pageId);
    const noteName = getPageTitle(page);
    if (!noteName.startsWith('Deutsch B2')) continue;

    if (type === 'quiz') {
      const m = noteName.match(/(\d{4}-\d{2}-\d{2})/);
      if (m) quizDates.push(m[1]);
      continue;
    }

    try {
      const raw = await window.cowork.callMcpTool('notion_retrieve_block_children', { block_id: pageId });
      if (raw && raw.isError) { diagLines.push('retrieve_blocks "' + noteName + '" -> error'); continue; }
      const norm = normalizeMcpResponse(raw);
      const blocks = Array.isArray(norm) ? norm : (norm && Array.isArray(norm.results) ? norm.results : []);
      const codeBlock = blocks.find(b => b && b.type === 'code');
      if (!codeBlock) { diagLines.push('"' + noteName + '" -> no JSON code block'); continue; }
      const richText = codeBlock.code && codeBlock.code.rich_text;
      const codeText = Array.isArray(richText) ? richText.map(t => (t && t.plain_text) || '').join('') : '';
      if (!codeText.trim()) { diagLines.push('"' + noteName + '" -> empty code block'); continue; }
      try {
        const session = JSON.parse(codeText);
        if (session && session.date) {
          if (!session.type) session.type = type;
          sessions.push(session);
          diagLines.push('"' + noteName + '" -> ok');
        }
      } catch { diagLines.push('"' + noteName + '" -> JSON parse failed'); }
    } catch (e) {
      diagLines.push('retrieve_blocks "' + noteName + '" -> ' + (e.message || String(e)));
    }
  }

  if (sessions.length === 0) return { ok: false, diag: diagLines.join('\n') };
  sessions.sort((a, b) => a.date.localeCompare(b.date));
  return { ok: true, sessions, reviewDates: quizDates, diag: diagLines.join('\n') };
}

async function boot() {
  document.getElementById('app').innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted);padding:40px">Trying live Notion load...</div>';

    setBanner('live');
    render(live.sessions, live.reviewDates);

    setBanner('snapshot', live.diag);
    render(SNAPSHOT_SESSIONS, SNAPSHOT_REVIEW_DATES);
  }
}

function render(sessions, reviewDates) {
  const totalSessions = sessions.length;
  const allNouns = new Map(), allAdj = new Map(), allVerbs = new Map(), allIdioms = new Map();
  let totalMistakes = 0;
  const mistakeByCat = {};
  const catSessionSet = new Map();
  sessions.forEach(s => {
    (s.nouns || []).forEach(n => { if (n.word) { const k = n.word.toLowerCase(); const prev = allNouns.get(k); allNouns.set(k, { ...n, firstDate: prev ? prev.firstDate : s.date, firstTheme: prev ? prev.firstTheme : s.theme }); } });
    (s.adjectives || []).forEach(a => { if (a.word) { const k = a.word.toLowerCase(); const prev = allAdj.get(k); allAdj.set(k, { ...a, firstDate: prev ? prev.firstDate : s.date, firstTheme: prev ? prev.firstTheme : s.theme }); } });
    (s.verbs || []).forEach(v => { const k = (v.infinitive||'').toLowerCase().split(/[\s(]/)[0]; if (k) { const prev = allVerbs.get(k); allVerbs.set(k, { ...v, firstDate: prev ? prev.firstDate : s.date, firstTheme: prev ? prev.firstTheme : s.theme }); } });
    (s.idioms || []).forEach(i => { if (i.idiom) { const k = i.idiom.toLowerCase(); const prev = allIdioms.get(k); allIdioms.set(k, { ...i, firstDate: prev ? prev.firstDate : s.date, firstTheme: prev ? prev.firstTheme : s.theme }); } });
    const seenCatsThisSession = new Set();
    (s.mistakes || []).forEach(m => {
      totalMistakes++;
      const cat = m.category || 'Sonstiges';
      mistakeByCat[cat] = (mistakeByCat[cat] || 0) + 1;
      if (!seenCatsThisSession.has(cat)) {
        seenCatsThisSession.add(cat);
        if (!catSessionSet.has(cat)) catSessionSet.set(cat, new Set());
        catSessionSet.get(cat).add(s.date);
      }
    });
  });
  const themeCount = {};
  sessions.forEach(s => { if (s.theme) themeCount[s.theme] = (themeCount[s.theme] || 0) + 1; });
  const activitySet = new Set([...sessions.map(s => s.date), ...reviewDates].filter(Boolean));
  const activeDays7 = computeActiveDays7(activitySet);
  const b2 = { 'dass-Sätze': 0, 'weil-Sätze': 0, 'wenn-Sätze': 0, 'Konjunktiv II': 0, 'Passiv': 0, 'Genitiv': 0, 'Komplexe Sätze (Nebensätze)': 0 };
  let totalWords = 0, totalQ = 0, reuseW = 0, reuseI = 0;
  sessions.forEach(s => {
    Object.keys(b2).forEach(k => { const v = s.stats && s.stats[k]; if (typeof v === 'number') b2[k] += v; });
    if (s.stats && typeof s.stats['Wörter insgesamt'] === 'number') totalWords += s.stats['Wörter insgesamt'];
    if (s.stats && typeof s.stats['Eigene Fragen gestellt'] === 'number') totalQ += s.stats['Eigene Fragen gestellt'];
    if (s.stats && typeof s.stats['Wiederverwendung alter Wörter'] === 'number') reuseW += s.stats['Wiederverwendung alter Wörter'];
    if (s.stats && typeof s.stats['Wiederverwendung alter Redewendungen'] === 'number') reuseI += s.stats['Wiederverwendung alter Redewendungen'];
  });
  let listenCorrect = 0, listenTotal = 0;
  sessions.forEach(s => {
    if (s.type === 'listening' || s.type === 'reading') {
      const scoreStr = s.stats && (s.stats['Hörverstehen (richtig/gesamt)'] || s.stats['Leseverstehen (richtig/gesamt)']);
      if (scoreStr) {
        const parts = String(scoreStr).split('/');
        if (parts.length === 2) {
          const c = parseInt(parts[0], 10), t = parseInt(parts[1], 10);
          if (!isNaN(c) && !isNaN(t) && t > 0) { listenCorrect += c; listenTotal += t; }
        }
      }
    }
  });
  const listenPct = listenTotal > 0 ? Math.round(listenCorrect / listenTotal * 100) : null;
  const topCats = Object.entries(mistakeByCat).sort((a,b) => b[1]-a[1]);

  const totalLiveSessions = sessions.filter(s => s.mistakes && s.mistakes.length > 0).length;
  const stickyCats = Array.from(catSessionSet.entries())
    .map(function(entry) {
      return { category: entry[0], sessions: entry[1].size, totalCount: mistakeByCat[entry[0]] || 0, exampleMistakes: [] };
    })
    .sort((a, b) => (b.sessions - a.sessions) || (b.totalCount - a.totalCount))
    .slice(0, 6);
  stickyCats.forEach(sc => {
    for (const s of sessions) {
      for (const m of (s.mistakes || [])) {
        if ((m.category || 'Sonstiges') === sc.category) {
          sc.exampleMistakes.push({ wrong: m.wrong, right: m.right, date: s.date });
          if (sc.exampleMistakes.length >= 2) break;
        }
      }
      if (sc.exampleMistakes.length >= 2) break;
    }
  });

  // Trend computation: split sessions in half chronologically
  const half = Math.floor(sessions.length / 2);
  const firstHalf = sessions.slice(0, half);
  const secondHalf = sessions.slice(half);
  function catCountInHalf(cat, halfSessions) {
    let count = 0;
    halfSessions.forEach(s => (s.mistakes || []).forEach(m => { if ((m.category || 'Sonstiges') === cat) count++; }));
    return count;
  }

  const cumulative = sessions.map(function(s, i) {
    const nounSet = new Set(), verbSet = new Set(), idiomSet = new Set();
    for (let j = 0; j <= i; j++) {
      (sessions[j].nouns || []).forEach(n => nounSet.add(n.word.toLowerCase()));
      (sessions[j].verbs || []).forEach(v => verbSet.add((v.infinitive||'').toLowerCase().split(/[\s(]/)[0]));
      (sessions[j].idioms || []).forEach(id => idiomSet.add(id.idiom.toLowerCase()));
    }
    return { date: s.date, nouns: nounSet.size, verbs: verbSet.size, idioms: idiomSet.size };
  });

  const grammarSessions = sessions.filter(s => s.type === 'grammar');
  const writingSessions = sessions.filter(s => s.type === 'writing');
  const reviewSessions = sessions.filter(s => s.type === 'review');
  const latestReview = reviewSessions.length > 0 ? reviewSessions[reviewSessions.length - 1] : null;

  window._sessions = sessions.slice().reverse();

  document.getElementById('subtitle').textContent = totalSessions + ' session' + (totalSessions === 1 ? '' : 's') + ' tracked';

  // Monthly focus card
  var focusCardHtml = '';
  if (latestReview) {
    var cats = [latestReview.stats['Häufigste Fehlerkategorie'], latestReview.stats['Zweithäufigste Fehlerkategorie'], latestReview.stats['Dritthäufigste Fehlerkategorie']].filter(Boolean);

    }
  }

  // Sticky cats trend rows
  var stickyCatsRows = stickyCats.map(function(sc) {
    var pctSessions = totalLiveSessions > 0 ? Math.round(sc.sessions / totalLiveSessions * 100) : 0;
    var c1 = catCountInHalf(sc.category, firstHalf);
    var c2 = catCountInHalf(sc.category, secondHalf);
    var trendHtml = '';
    var trendTitle = c1 + ' in first half, ' + c2 + ' in second half';
    if (sessions.length < 2) { trendHtml = '<span class="trend-stable" title="Need more sessions">—</span>'; }
    else if (c2 > c1) { trendHtml = '<span class="trend-up" title="' + trendTitle + '">▲ worse</span>'; }
    else if (c2 < c1) { trendHtml = '<span class="trend-down" title="' + trendTitle + '">▼ improving</span>'; }
    else { trendHtml = '<span class="trend-stable" title="' + trendTitle + '">→ stable</span>'; }
    return '<tr><td><span class="tag" style="background:' + (CATEGORY_COLORS[sc.category]||'#ddd') + ';color:white">' + escapeHtml(sc.category) + '</span></td><td><b>' + sc.sessions + '</b> of ' + totalLiveSessions + ' <span class="muted">(' + pctSessions + '%)</span></td><td>' + sc.totalCount + '</td><td>' + trendHtml + '</td><td>' + sc.exampleMistakes.map(function(m) { return '<div style="margin-bottom:3px;font-size:12px"><span style="color:var(--wrong)">' + escapeHtml(m.wrong) + '</span> <span class="muted">→</span> <span style="color:var(--right)">' + escapeHtml(m.right) + '</span></div>'; }).join('') + '</td></tr>';
  }).join('');

  // Grammar card
  var grammarCardHtml = '';
  if (grammarSessions.length > 0) {
    var gFillScores = grammarSessions.map(function(s) { return s.stats && s.stats['Lückentext richtig']; }).filter(Boolean);
    var gFillPct = '—';
    if (gFillScores.length) { var gFc = 0, gFt = 0; gFillScores.forEach(function(sc) { var p = String(sc).split('/'); if (p.length===2) { gFc+=parseInt(p[0])||0; gFt+=parseInt(p[1])||0; } }); if (gFt>0) gFillPct = Math.round(gFc/gFt*100)+'%'; }
    var gTransScores = grammarSessions.map(function(s) { return s.stats && s.stats['Umformung richtig']; }).filter(Boolean);
    var gTransPct = '—';
    if (gTransScores.length) { var gTc = 0, gTt = 0; gTransScores.forEach(function(sc) { var p = String(sc).split('/'); if (p.length===2) { gTc+=parseInt(p[0])||0; gTt+=parseInt(p[1])||0; } }); if (gTt>0) gTransPct = Math.round(gTc/gTt*100)+'%'; }
    var gTopics = Array.from(new Set(grammarSessions.map(function(s) { return s.stats && s.stats['Thema']; }).filter(Boolean)));

    }).join('');
    grammarCardHtml = '<h2>Grammar Sessions</h2><div class="card"><div class="kpi-grid" style="margin-bottom:12px"><div class="kpi-card"><div class="kpi-value">' + grammarSessions.length + '</div><div class="kpi-label">Grammar sessions</div></div><div class="kpi-card"><div class="kpi-value">' + gFillPct + '</div><div class="kpi-label">Avg fill-in score</div></div><div class="kpi-card"><div class="kpi-value">' + gTransPct + '</div><div class="kpi-label">Avg transform score</div></div></div><div style="margin-bottom:8px">' + gTopics.map(function(t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div><table class="data"><thead><tr><th>Date</th><th>Topic</th><th>Fill-in</th><th>Transform</th></tr></thead><tbody>' + gRows + '</tbody></table></div>';

  // Writing card
  var writingCardHtml = '';

    var wReg = writingSessions.filter(function(s) { return s.stats && s.stats['Register korrekt'] === 'ja'; }).length;
    var wRegPct = writingSessions.length ? Math.round(wReg/writingSessions.length*100)+'%' : '—';
    var wTypes = Array.from(new Set(writingSessions.map(function(s) { return s.stats && s.stats['Aufgabentyp']; }).filter(Boolean)));
    writingCardHtml = '<h2>Writing Sessions</h2><div class="card"><div class="kpi-grid" style="margin-bottom:12px"><div class="kpi-card"><div class="kpi-value">' + writingSessions.length + '</div><div class="kpi-label">Writing sessions</div></div><div class="kpi-card"><div class="kpi-value">' + wAvgWords + '</div><div class="kpi-label">Avg word count</div></div><div class="kpi-card"><div class="kpi-value">' + wRegPct + '</div><div class="kpi-label">Register accuracy</div></div></div><div style="margin-bottom:8px">' + wTypes.map(function(t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div></div>';
  }

  var sessionLogRows = window._sessions.map(function(s, idx) {

  }).join('');

  // Top cats rows
  var topCatRows = topCats.map(function(entry) {

  }).join('');

  document.getElementById('app').innerHTML =
    focusCardHtml +
    '<section><div class="kpi-grid">' +
    '<div class="kpi-card"><div class="kpi-value">' + totalSessions + '</div><div class="kpi-label">Sessions</div></div>' +
    '<div class="kpi-card"><div class="kpi-value">' + activeDays7 + '</div><div class="kpi-label">Active Days (7d)</div></div>' +
    '<div class="kpi-card"><div class="kpi-value">' + (allNouns.size + allAdj.size) + '</div><div class="kpi-label">Words</div></div>' +
    '<div class="kpi-card"><div class="kpi-value">' + allVerbs.size + '</div><div class="kpi-label">Verbs</div></div>' +

    '<div class="kpi-card"><div class="kpi-value">' + Object.keys(themeCount).length + '</div><div class="kpi-label">Themes</div></div>' +
    '<div class="kpi-card"><div class="kpi-value">' + (listenPct !== null ? listenPct + '%' : '—') + '</div><div class="kpi-label">Listen/Read score</div></div>' +
    '</div></section>' +
    (stickyCats.length > 0 ? '<div class="banner focus"><span>📌 <b>Recommended focus:</b> ' + escapeHtml(stickyCats[0].category) + ' — your most recurring mistake (' + stickyCats[0].sessions + ' session' + (stickyCats[0].sessions===1?'':'s') + ', ' + stickyCats[0].totalCount + ' total). Target this in your next practice session.</span></div>' : '') +
    '<h2>Consistency</h2><div class="card"><div id="heatmap" class="heatmap"></div><div class="legend"><span><span class="sw" style="background:var(--cell-conv)"></span>Conversation</span><span><span class="sw" style="background:var(--cell-listen)"></span>Listening/Reading</span><span><span class="sw" style="background:var(--cell-quiz)"></span>Quiz</span><span><span class="sw" style="background:var(--cell-writing)"></span>Writing</span><span><span class="sw" style="background:var(--cell-grammar)"></span>Grammar</span><span><span class="sw" style="background:var(--cell-review)"></span>Review</span><span><span class="sw" style="background:var(--cell-both)"></span>Multiple</span><span><span class="sw" style="background:var(--cell-empty);border:1px solid var(--border)"></span>No practice</span></div><div class="hint" id="streakHint"></div></div>' +
    '<h2>Themes Covered</h2><div class="card">' + (Object.entries(themeCount).sort(function(a,b){return b[1]-a[1];}).map(function(entry) { return '<span class="tag">' + escapeHtml(entry[0]) + (entry[1]>1?' ×'+entry[1]:'') + '</span>'; }).join('') || '<div class="muted">No themes yet.</div>') + '<div class="hint">Aim for variety. Themes you haven\'t tried could be next week\'s conversation.</div></div>' +
    '<div class="row"><div><h2>B2 Structures Used</h2><div class="card"><p class="section-intro">"Grown-up grammar" markers across all sessions.</p><div class="chart-box"><canvas id="b2Chart"></canvas></div></div></div><div><h2>Mistake Patterns</h2><div class="card"><p class="section-intro">Where your brain keeps tripping.</p><div class="chart-box"><canvas id="mistakeChart"></canvas></div></div></div></div>' +
    '<h2>Cumulative Knowledge</h2><div class="card"><p class="section-intro">Your vocabulary, verbs, and idioms growing session by session.</p><div class="chart-box"><canvas id="cumulativeChart"></canvas></div></div>' +
    '<h2>Top Mistake Categories</h2><div class="card">' + (topCats.length === 0 ? '<div class="muted">No mistakes tracked yet.</div>' : '<table class="data"><thead><tr><th>Category</th><th>Count</th><th>Share</th></tr></thead><tbody>' + topCatRows + '</tbody></table>') + '</div>' +
    '<h2>Sticky Categories</h2><div class="card"><p class="section-intro">Which mistake categories appear in the most sessions — your real recurring pattern list.</p>' + (stickyCats.length === 0 ? '<div class="muted">No mistake data yet.</div>' : '<table class="data"><thead><tr><th>Category</th><th>Appeared in</th><th>Count</th><th>Trend</th><th>Recent examples</th></tr></thead><tbody>' + stickyCatsRows + '</tbody></table>') + '</div>' +
    grammarCardHtml +
    writingCardHtml +
    '<h2>Vocabulary Explorer</h2><div class="card"><div class="kpi-grid" style="margin-bottom:0"><div class="kpi-card"><div class="kpi-value">' + reuseW + '</div><div class="kpi-label">Reused words</div></div><div class="kpi-card"><div class="kpi-value">' + reuseI + '</div><div class="kpi-label">Reused idioms</div></div><div class="kpi-card"><div class="kpi-value">' + totalQ + '</div><div class="kpi-label">Initiative moments</div></div><div class="kpi-card"><div class="kpi-value">' + (totalSessions > 0 ? Math.round(totalWords/totalSessions) : 0) + '</div><div class="kpi-label">Avg words/session</div></div></div><div style="text-align:right;margin:8px 0 0 0"><button onclick="exportVocabCSV()" style="background:var(--primary);color:white;border:0;padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit">Export CSV</button></div>' +
    '<div class="vtabs-nav"><button class="vtab active" data-vtab="nouns">📚 Nouns & Adj <span class="vtab-count">' + (allNouns.size + allAdj.size) + '</span></button><button class="vtab" data-vtab="verbs">⚙️ Verbs <span class="vtab-count">' + allVerbs.size + '</span></button><button class="vtab" data-vtab="idioms">🎭 Idioms <span class="vtab-count">' + allIdioms.size + '</span></button><button class="vtab" data-vtab="ready">⏰ Ready to Reuse <span class="vtab-count" id="readyCount"></span></button><button class="vtab" data-vtab="reused">✨ Reused <span class="vtab-count" id="reusedCount"></span></button></div>' +
    '<div class="vtab-panel active" id="vtab-nouns"><div class="vtab-controls"><input type="text" class="vsearch" data-tab="nouns" placeholder="Search nouns and adjectives..."><select class="vtheme-filter" data-tab="nouns"><option value="all">All themes</option></select><select class="vsort-toggle" data-tab="nouns"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">A → Z</option></select></div><div class="vtab-list" id="vlist-nouns"></div></div>' +
    '<div class="vtab-panel" id="vtab-verbs"><div class="vtab-controls"><input type="text" class="vsearch" data-tab="verbs" placeholder="Search verbs..."><select class="vtheme-filter" data-tab="verbs"><option value="all">All themes</option></select><select class="vsort-toggle" data-tab="verbs"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">A → Z</option></select></div><div class="vtab-list" id="vlist-verbs"></div></div>' +
    '<div class="vtab-panel" id="vtab-idioms"><div class="vtab-controls"><input type="text" class="vsearch" data-tab="idioms" placeholder="Search idioms..."><select class="vtheme-filter" data-tab="idioms"><option value="all">All themes</option></select><select class="vsort-toggle" data-tab="idioms"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">A → Z</option></select></div><div class="vtab-list" id="vlist-idioms"></div></div>' +
    '<div class="vtab-panel" id="vtab-ready"><p class="section-intro">Words, verbs, and idioms learned more than 14 days ago that haven\'t been marked as reused. Pull one into next Tuesday\'s conversation to move it from "know it" to "own it."</p><div class="vtab-controls"><input type="text" class="vsearch" data-tab="ready" placeholder="Search..."><select class="vtheme-filter" data-tab="ready"><option value="all">All themes</option></select><select class="vsort-toggle" data-tab="ready"><option value="stale">Most stale (longest since learned)</option><option value="newest">Newest first</option><option value="az">A → Z</option></select></div><div class="vtab-list" id="vlist-ready"></div></div>' +
    '<div class="vtab-panel" id="vtab-reused"><p class="section-intro">Specific items you have actively reused in later sessions. Historical sessions only tracked reuse counts, so this fills in going forward from your next Tuesday session.</p><div class="vtab-list" id="vlist-reused"></div></div>' +
    '</div>' +
    '<h2>Session Log</h2><div class="card"><table class="data"><thead><tr><th>Date</th><th>Type</th><th>Theme</th><th>Words</th><th>Verbs</th><th>Idioms</th><th>Mistakes</th><th>Total Wörter</th></tr></thead><tbody>' + sessionLogRows + '</tbody></table></div>';

  renderHeatmap(sessions, reviewDates, activeDays7);
  renderB2Chart(b2);
  renderMistakeChart(mistakeByCat);
  renderCumulativeChart(cumulative);
  window._allNouns = allNouns; window._allAdj = allAdj; window._allVerbs = allVerbs; window._allIdioms = allIdioms;
  setupVocabTabs(allNouns, allAdj, allVerbs, allIdioms, sessions);
}

function renderSessionDetail(s) {
  var hasNouns = (s.nouns||[]).length + (s.adjectives||[]).length > 0;
  var hasVerbs = (s.verbs||[]).length > 0;
  var hasIdioms = (s.idioms||[]).length > 0;
  var hasMistakes = (s.mistakes||[]).length > 0;
  if (!hasNouns && !hasVerbs && !hasIdioms && !hasMistakes) {
    return '<div class="muted">No detailed data for this session type.</div>';
  }
  var html = '';
  if (hasNouns || hasVerbs || hasIdioms) {
    html += '<div style="margin-bottom:8px"><b style="font-size:12px;color:var(--text-2)">Vocabulary</b><div style="margin-top:4px">';
    (s.nouns||[]).forEach(function(n) { html += '<span class="tag">' + escapeHtml(n.word) + '</span>'; });
    (s.adjectives||[]).forEach(function(a) { html += '<span class="tag dim">' + escapeHtml(a.word) + '</span>'; });
    (s.verbs||[]).forEach(function(v) { html += '<span class="tag">' + escapeHtml(v.infinitive) + '</span>'; });
    (s.idioms||[]).forEach(function(i) { html += '<span class="tag dim">' + escapeHtml(i.idiom) + '</span>'; });
    html += '</div></div>';
  }
  if (hasMistakes) {
    html += '<b style="font-size:12px;color:var(--text-2)">Mistakes</b>';
    html += '<table class="data" style="margin-top:4px;font-size:12px"><thead><tr><th>Category</th><th>Wrong</th><th>Right</th></tr></thead><tbody>';
    (s.mistakes||[]).forEach(function(m) {
      html += '<tr><td><span class="tag" style="background:' + (CATEGORY_COLORS[m.category||'Sonstiges']||'#ddd') + ';color:white;font-size:11px">' + escapeHtml(m.category||'Sonstiges') + '</span></td><td style="color:var(--wrong)">' + escapeHtml(m.wrong) + '</td><td style="color:var(--right)">' + escapeHtml(m.right) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  return html;
}

window.toggleDetail = function(idx) {
  var row = document.getElementById('detail-' + idx);
  if (!row) return;
  row.classList.toggle('open');
};

function computeActiveDays7(dateSet) {
  var cutoff = daysAgo(7);
  return Array.from(dateSet).filter(function(d) { return d >= cutoff; }).length;
}

function daysAgo(n) {
  var d = new Date(); d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

function setupVocabTabs(allNouns, allAdj, allVerbs, allIdioms, sessions) {
  var today = new Date();
  var daysSince = function(d) { return Math.floor((today - new Date(d)) / 86400000); };
  var READY_DAYS = 14;

  var nounsAdjs = [
    ...Array.from(allNouns.values()).map(function(n) { return Object.assign({}, n, { displayWord: n.word, type: 'Nomen' }); }),
    ...Array.from(allAdj.values()).map(function(a) { return Object.assign({}, a, { displayWord: a.word, type: 'Adjektiv' }); })
  ];
  var verbs = Array.from(allVerbs.values()).map(function(v) { return Object.assign({}, v, { displayWord: v.infinitive, type: 'Verb' }); });
  var idioms = Array.from(allIdioms.values()).map(function(i) { return Object.assign({}, i, { displayWord: i.idiom, type: 'Redewendung' }); });

  var ready = [...nounsAdjs, ...verbs, ...idioms].filter(function(x) { return x.firstDate && daysSince(x.firstDate) >= READY_DAYS; });
  var reused = [];

  var tabData = { nouns: nounsAdjs, verbs: verbs, idioms: idioms, ready: ready, reused: reused };

  var readyCountEl = document.getElementById('readyCount');
  if (readyCountEl) readyCountEl.textContent = ready.length;
  var reusedCountEl = document.getElementById('reusedCount');
  if (reusedCountEl) reusedCountEl.textContent = reused.length;

  var collectThemes = function(items) { return Array.from(new Set(items.map(function(x) { return x.firstTheme; }).filter(Boolean))).sort(); };
  ['nouns', 'verbs', 'idioms', 'ready'].forEach(function(tab) {
    var themes = collectThemes(tabData[tab]);
    var sel = document.querySelector('.vtheme-filter[data-tab="' + tab + '"]');
    if (sel && themes.length) {
      themes.forEach(function(t) { var opt = document.createElement('option'); opt.value = t; opt.textContent = t; sel.appendChild(opt); });
    }
  });

  var state = {
    nouns: { search: '', theme: 'all', sort: 'newest' },
    verbs: { search: '', theme: 'all', sort: 'newest' },
    idioms: { search: '', theme: 'all', sort: 'newest' },
    ready: { search: '', theme: 'all', sort: 'stale' },
    reused: { search: '', theme: 'all', sort: 'newest' }
  };

  function filterAndSort(items, tab) {
    var s = state[tab];
    var result = items;
    if (s.search) {
      var q = s.search.toLowerCase();
      result = result.filter(function(x) { return (x.displayWord||'').toLowerCase().includes(q)||(x.meaning||'').toLowerCase().includes(q)||(x.example||'').toLowerCase().includes(q); });
    }
    if (s.theme !== 'all') result = result.filter(function(x) { return (x.firstTheme||'') === s.theme; });
    result = result.slice();
    if (s.sort === 'newest') result.sort(function(a,b) { return (b.firstDate||'').localeCompare(a.firstDate||''); });
    else if (s.sort === 'oldest' || s.sort === 'stale') result.sort(function(a,b) { return (a.firstDate||'').localeCompare(b.firstDate||''); });
    else if (s.sort === 'az') result.sort(function(a,b) { return (a.displayWord||'').localeCompare(b.displayWord||''); });
    return result;
  }

  function renderItem(item) {
    var days = item.firstDate ? daysSince(item.firstDate) : null;
    var staleClass = days !== null && days >= READY_DAYS ? ' stale' : '';
    var dateLabel = item.firstDate ? item.firstDate + (days !== null && days >= READY_DAYS ? ' (' + days + 'd)' : '') : '';
    var themeLabel = item.firstTheme ? '<span style="color:var(--text-2)">' + escapeHtml(item.firstTheme) + '</span> · ' : '';
    return '<div class="vitem' + staleClass + '"><span class="vitem-word">' + escapeHtml(item.displayWord||'') + '</span><span class="vitem-meaning">' + escapeHtml(item.meaning||'') + '</span><span class="vitem-meta">' + themeLabel + dateLabel + '</span></div>';
  }

  function renderList(tab) {
    var listEl = document.getElementById('vlist-' + tab);
    if (!listEl) return;
    if (tab === 'reused' && reused.length === 0) {
      listEl.innerHTML = '<div class="vtab-empty">✨ Named reused items will start appearing here after your next Tuesday session.</div>';
      return;
    }
    var items = filterAndSort(tabData[tab], tab);
    if (items.length === 0) { listEl.innerHTML = '<div class="vtab-empty">No matches. Try clearing the search or changing the filter.</div>'; return; }
    listEl.innerHTML = items.map(renderItem).join('');
  }

  document.querySelectorAll('.vtab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.vtab').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.vtab-panel').forEach(function(p) { p.classList.remove('active'); });
      btn.classList.add('active');
      var tab = btn.dataset.vtab;
      var panel = document.getElementById('vtab-' + tab);
      if (panel) panel.classList.add('active');
    });
  });

  document.querySelectorAll('.vsearch').forEach(function(inp) {
    inp.addEventListener('input', function(e) { state[e.target.dataset.tab].search = e.target.value.trim(); renderList(e.target.dataset.tab); });
  });
  document.querySelectorAll('.vtheme-filter').forEach(function(sel) {
    sel.addEventListener('change', function(e) { state[e.target.dataset.tab].theme = e.target.value; renderList(e.target.dataset.tab); });
  });
  document.querySelectorAll('.vsort-toggle').forEach(function(sel) {
    sel.addEventListener('change', function(e) { state[e.target.dataset.tab].sort = e.target.value; renderList(e.target.dataset.tab); });
  });

  ['nouns', 'verbs', 'idioms', 'ready', 'reused'].forEach(renderList);
}

function renderHeatmap(sessions, reviewDates, activeDays7) {
  var days = window.innerWidth < 480 ? 28 : 56;
  var byDate = {};
  sessions.forEach(function(s) {
    if (!s.date) return;
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s.type || 'conv');
  });
  var rev = new Set(reviewDates);
  var cells = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var iso = d.toISOString().slice(0, 10);
    var types = byDate[iso] || [];
    var hasRev = rev.has(iso);
    var cls = 'cell';
    var typeLabel = '';
    if (types.length > 1 || (types.length > 0 && hasRev)) {
      cls += ' both';
      typeLabel = types.join('+') + (hasRev ? '+quiz' : '');
    } else if (types.length === 1) {
      var t = types[0];
      if (t === 'writing') cls += ' writing';
      else if (t === 'grammar') cls += ' grammar';
      else if (t === 'review') cls += ' monthly-review';
      else if (t === 'listening' || t === 'reading') cls += ' listening';
      else cls += ' conv';
      typeLabel = t;
    } else if (hasRev) {
      cls += ' quiz';
      typeLabel = 'Quiz';
    }
    cells.push('<div class="' + cls + '" title="' + iso + (typeLabel ? ' (' + typeLabel + ')' : '') + '"></div>');
  }
  document.getElementById('heatmap').innerHTML = cells.join('');
  document.getElementById('streakHint').textContent = activeDays7 > 0
    ? activeDays7 + ' active day' + (activeDays7===1?'':'s') + ' in the last 7 days.'
    : 'No sessions in the last 7 days. Your next scheduled session will start one.';
}

function renderB2Chart(totals) {
  var ctx = document.getElementById('b2Chart').getContext('2d');
  var labels = Object.keys(totals).map(function(k) { return k.replace('-Sätze', '').replace('Komplexe Sätze (Nebensätze)', 'Nebensätze'); });
  var data = Object.values(totals);
  new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: 'Uses', data: data, backgroundColor: '#8B5CF6', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

function renderMistakeChart(byCat) {
  var ctx = document.getElementById('mistakeChart').getContext('2d');
  var entries = Object.entries(byCat).sort(function(a,b){return b[1]-a[1];});
  if (entries.length === 0) {
    ctx.canvas.parentElement.innerHTML = '<div class="muted" style="padding:40px;text-align:center">No mistakes tracked yet.</div>';
    return;
  }
  new Chart(ctx, {
    type: 'doughnut',
    data: { labels: entries.map(function(e){return e[0];}), datasets: [{ data: entries.map(function(e){return e[1];}), backgroundColor: entries.map(function(e){return CATEGORY_COLORS[e[0]]||'#aaa';}), borderWidth: 2, borderColor: '#0F172A' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } } }
  });
}

function renderCumulativeChart(rows) {
  var ctx = document.getElementById('cumulativeChart').getContext('2d');
  if (rows.length === 0) {
    ctx.canvas.parentElement.innerHTML = '<div class="muted" style="padding:40px;text-align:center">No data yet.</div>';
    return;
  }
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: rows.map(function(r){return r.date;}),
      datasets: [
        { label: 'Nouns/Adj', data: rows.map(function(r){return r.nouns;}), borderColor: '#8B5CF6', backgroundColor: '#8B5CF633', tension: 0.3, fill: true },
        { label: 'Verbs', data: rows.map(function(r){return r.verbs;}), borderColor: '#06B6D4', backgroundColor: '#06B6D433', tension: 0.3, fill: true },
        { label: 'Idioms', data: rows.map(function(r){return r.idioms;}), borderColor: '#F59E0B', backgroundColor: '#F59E0B33', tension: 0.3, fill: true }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

function exportVocabCSV() {
  var rows = [['Type','Word','Plural','Meaning','Example','Theme','Date']];
  Array.from((window._allNouns || new Map()).values()).forEach(function(n) { rows.push(['Noun', n.word||'', n.plural||'', n.meaning||'', n.example||'', n.firstTheme||'', n.firstDate||'']); });
  Array.from((window._allAdj || new Map()).values()).forEach(function(a) { rows.push(['Adjective', a.word||'', '', a.meaning||'', a.example||'', a.firstTheme||'', a.firstDate||'']); });
  Array.from((window._allVerbs || new Map()).values()).forEach(function(v) { rows.push(['Verb', v.infinitive||'', '', v.meaning||'', v.example||'', v.firstTheme||'', v.firstDate||'']); });
  Array.from((window._allIdioms || new Map()).values()).forEach(function(i) { rows.push(['Idiom', i.idiom||'', '', i.meaning||'', i.example||'', i.firstTheme||'', i.firstDate||'']); });
  var csv = rows.map(function(r) { return r.map(function(f) { return '"' + String(f).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8;'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'deutsch-b2-vocab-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
